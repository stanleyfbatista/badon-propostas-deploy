<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#0a0a0c">
  <title>Página não encontrada — Bādon</title>
  <link rel="icon" href="/maintenance-assets/favicon.svg" type="image/svg+xml">
  <style>
    :root{--ink:#0a0a0c;--white:#f4f7fb;--muted:#aaa9ae;--blue:#0053c3;--blue-dark:#003276;--line:rgba(255,255,255,.14)}
    *{box-sizing:border-box}
    html,body{min-height:100%}
    body{margin:0;min-height:100svh;background:radial-gradient(circle at 82% 18%,rgba(0,83,195,.22),transparent 30rem),var(--ink);color:var(--white);font-family:Inter,"Helvetica Neue",Arial,sans-serif;-webkit-font-smoothing:antialiased;overflow-x:hidden}
    body:before{content:"404";position:fixed;right:-.08em;bottom:-.28em;color:rgba(0,83,195,.08);font-size:min(58vw,760px);font-weight:900;letter-spacing:-.1em;line-height:1;pointer-events:none}
    main{width:min(100%,1240px);min-height:100svh;margin:0 auto;padding:clamp(28px,5vw,64px);display:grid;grid-template-rows:auto 1fr auto;position:relative;z-index:1}
    .brand{display:inline-flex;width:clamp(180px,19vw,260px)}
    .brand img{display:block;width:100%;height:auto}
    .content{align-self:center;max-width:880px;padding:64px 0}
    .code{margin:0 0 22px;color:#468de9;font-size:13px;font-weight:800;letter-spacing:.18em;text-transform:uppercase}
    h1{margin:0;font-size:clamp(58px,8.5vw,122px);line-height:.92;letter-spacing:-.065em}
    .lead{max-width:650px;margin:30px 0 0;color:var(--muted);font-size:clamp(17px,2vw,21px);line-height:1.65}
    .actions{display:flex;flex-wrap:wrap;gap:12px;margin-top:38px}
    .button{display:inline-flex;align-items:center;justify-content:center;min-height:56px;padding:0 25px;border:1px solid transparent;border-radius:999px;background:linear-gradient(90deg,var(--blue),var(--blue-dark));color:#fff;text-decoration:none;font-weight:800;transition:transform .2s ease}
    .button.secondary{background:transparent;border-color:var(--line);color:var(--white)}
    .button:hover{transform:translateY(-2px)}
    .button:focus-visible{outline:3px solid #fff;outline-offset:4px}
    footer{padding-top:24px;border-top:1px solid var(--line);display:flex;justify-content:space-between;gap:20px;color:#6f6e74;font-size:12px}
    @media(max-width:620px){main{padding:28px 22px}.content{padding:72px 0}h1{font-size:clamp(54px,17vw,82px)}.actions{align-items:stretch;flex-direction:column}.button{width:100%}footer{align-items:flex-start;flex-direction:column}}
    @media(prefers-reduced-motion:reduce){.button{transition:none}}
  </style>
</head>
<body>
  <main>
    <a class="brand" href="/" aria-label="Voltar para a página inicial da Bādon">
      <img src="/maintenance-assets/logo-badon.svg" alt="Bādon Produtora">
    </a>

    <section class="content" aria-labelledby="title">
      <p class="code">Erro 404</p>
      <h1 id="title">Essa página saiu do caminho.</h1>
      <p class="lead">O endereço pode ter mudado ou não existe. Você pode voltar ao início ou falar diretamente com a Bādon.</p>
      <div class="actions">
        <a class="button" href="/">Voltar ao início</a>
        <a class="button secondary" href="https://wa.me/message/NTSXADH2X3BFC1" target="_blank" rel="noopener noreferrer">Falar pelo WhatsApp</a>
      </div>
    </section>

    <footer>
      <span>Produtora Bādon</span>
      <span>Estratégia, tecnologia e criação.</span>
    </footer>
  </main>
</body>
</html>
