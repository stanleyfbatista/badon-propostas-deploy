  <script>
    const payload=JSON.parse(document.getElementById('payload').textContent);
    const form=document.getElementById('gate'),field=document.getElementById('password'),msg=document.getElementById('msg'),button=form.querySelector('button');
    const bytes=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
    form.addEventListener('submit',async event=>{event.preventDefault();msg.textContent='';button.disabled=true;button.textContent='Abrindo…';try{const baseKey=await crypto.subtle.importKey('raw',new TextEncoder().encode(field.value),'PBKDF2',false,['deriveKey']);const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:bytes(payload.salt),iterations:310000,hash:'SHA-256'},baseKey,{name:'AES-GCM',length:256},false,['decrypt']);const encrypted=bytes(payload.data),tag=bytes(payload.tag),combined=new Uint8Array(encrypted.length+tag.length);combined.set(encrypted);combined.set(tag,encrypted.length);const plain=await crypto.subtle.decrypt({name:'AES-GCM',iv:bytes(payload.iv),tagLength:128},key,combined);document.open();document.write(new TextDecoder().decode(plain));document.close()}catch(error){msg.textContent='Senha incorreta. Confira e tente novamente.';field.select();button.disabled=false;button.textContent='Acessar'}});
  </script>
