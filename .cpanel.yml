---
deployment:
  tasks:
    - export ROOTPATH=$HOME/public_html
    - export PROPOSALPATH=$HOME/public_html/propostas/dainese-a7k3
    - export ASSETPATH=$HOME/public_html/maintenance-assets
    - /bin/mkdir -p "$PROPOSALPATH"
    - /bin/mkdir -p "$ASSETPATH"
    - /bin/cp index.html "$ROOTPATH/index.html"
    - /bin/cp propostas/dainese-a7k3/index.html "$PROPOSALPATH/index.html"
    - /bin/cp -R maintenance-assets/. "$ASSETPATH/"
    - /bin/sh -c 'if [ -f "$ROOTPATH/.htaccess" ] && [ ! -f "$ROOTPATH/.htaccess.wordpress-backup" ]; then /bin/cp "$ROOTPATH/.htaccess" "$ROOTPATH/.htaccess.wordpress-backup"; fi'
    - /bin/sh -c '/bin/grep -q "^DirectoryIndex index.html index.php$" "$ROOTPATH/.htaccess" || /bin/sed -i "1i DirectoryIndex index.html index.php" "$ROOTPATH/.htaccess"'
