  <style>
    :root{color-scheme:dark;--bg:#131313;--panel:#1c1c1c;--line:#353535;--text:#f4f0ea;--muted:#a9a6a1;--accent:#9ad483;--danger:#f49a8e}
    *{box-sizing:border-box}body{margin:0;min-height:100svh;display:grid;place-items:center;background:radial-gradient(circle at 50% 0,#232723 0,#131313 44%);font:16px/1.5 Inter,Arial,sans-serif;color:var(--text);padding:24px}
    main{width:min(100%,440px);background:rgba(28,28,28,.96);border:1px solid var(--line);padding:36px;border-radius:18px;box-shadow:0 24px 80px #0008}
    .brand{font-size:25px;font-weight:750;letter-spacing:-.04em;margin-bottom:46px}.brand span{color:var(--accent)}
    .eyebrow{color:var(--accent);font-size:12px;font-weight:800;letter-spacing:.15em;text-transform:uppercase}
    h1{font-size:clamp(30px,7vw,43px);line-height:1.03;letter-spacing:-.055em;margin:13px 0 14px}
    p{color:var(--muted);margin:0 0 28px}
    label{display:block;font-size:13px;font-weight:750;margin-bottom:8px}
    .field{display:flex;gap:10px}input{min-width:0;flex:1;background:#101010;color:var(--text);border:1px solid var(--line);border-radius:10px;padding:14px 15px;font:inherit;outline:none}input:focus{border-color:var(--accent);box-shadow:0 0 0 3px #9ad48322}
    button{border:0;border-radius:10px;background:var(--accent);color:#10200f;padding:14px 19px;font:inherit;font-weight:850;cursor:pointer}button:disabled{opacity:.65;cursor:wait}
    #msg{min-height:24px;margin:12px 0 0;color:var(--danger);font-size:13px}.privacy{border-top:1px solid var(--line);margin-top:30px;padding-top:18px;font-size:12px;color:#777}
    @media(max-width:440px){main{padding:28px 22px}.field{display:grid}.brand{margin-bottom:36px}}
  </style>
</head>

  <script>
    const payload=JSON.parse(document.getElementById("payload").textContent);
    const form=document.getElementById("gate"),field=document.getElementById("password"),msg=document.getElementById("msg"),button=form.querySelector("button");
    const bytes=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
    form.addEventListener("submit",async event=>{
      event.preventDefault();msg.textContent="";button.disabled=true;button.textContent="Abrindo…";
      try{
        const baseKey=await crypto.subtle.importKey("raw",new TextEncoder().encode(field.value),"PBKDF2",false,["deriveKey"]);
        const key=await crypto.subtle.deriveKey({name:"PBKDF2",salt:bytes(payload.salt),iterations:310000,hash:"SHA-256"},baseKey,{name:"AES-GCM",length:256},false,["decrypt"]);
        const encrypted=bytes(payload.data),tag=bytes(payload.tag),combined=new Uint8Array(encrypted.length+tag.length);combined.set(encrypted);combined.set(tag,encrypted.length);
        const plain=await crypto.subtle.decrypt({name:"AES-GCM",iv:bytes(payload.iv),tagLength:128},key,combined);
        document.open();document.write(new TextDecoder().decode(plain));document.close();
      }catch(error){msg.textContent="Senha incorreta. Confira e tente novamente.";field.select();button.disabled=false;button.textContent="Acessar";}
    });
  </script>
